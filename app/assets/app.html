<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#18080b">
  <title>MidnightBeam</title>
  <!-- The phone app's own page (served on loopback by the app only). The TV and the browser remote use remote.html. -->
  <style>
    /* Hallmark · theme: arcade (by request) · arcade: oxblood/none · redesign: restyle · scope: app · no blue: gold leads, oxblood red answers, on wine-black */
    /* critique: the CRT screen texture is left out (its stripes carry blue and it would sit under running text); one RGB split, on the wordmark only */
    /* waive 37: "Silkscreen Digits" is the Silkscreen file limited to digits (units stay in Chivo), not a fourth family · waive 24b: restyle, the spacing of the kept layout */
    @font-face { font-family: "Chivo"; src: url(/fonts/Chivo-Regular.ttf) format("truetype"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Chivo"; src: url(/fonts/Chivo-Bold.ttf) format("truetype"); font-weight: 500 700; font-display: swap; }
    @font-face { font-family: "Chivo"; src: url(/fonts/Chivo-Black.ttf) format("truetype"); font-weight: 800 900; font-display: swap; }
    @font-face { font-family: "Bungee"; src: url(/fonts/Bungee-Regular.ttf) format("truetype"); font-display: swap; }
    @font-face { font-family: "Silkscreen"; src: url(/fonts/Silkscreen-Bold.ttf) format("truetype"); font-weight: 700; font-display: swap; }
    /* figures: the pixel face for the digits only, so a unit (%, K, dB) beside them stays in Chivo */
    @font-face { font-family: "Silkscreen Digits"; src: url(/fonts/Silkscreen-Bold.ttf) format("truetype"); font-weight: 400 900; unicode-range: U+0030-0039; font-display: swap; }
    :root {
      --paper: #18080b; --paper-2: #241015; --paper-3: #311a1f; --rule: #533239;
      --ink: #f3eee4; --ink-2: #dcd3c6; --muted: #b3a192;
      --accent: #edc23e; --accent-2: #d73337; --accent-2-ink: #f4514f; --accent-ink: #18080b; --focus: #edc23e;
      --font-display: "Bungee", Impact, sans-serif; --font-body: "Chivo", "Segoe UI", Roboto, system-ui, sans-serif; --font-figure: "Silkscreen", ui-monospace, monospace; --font-number: "Silkscreen Digits", "Chivo", sans-serif;
      --radius: 4px; --bar: 2px; --off: 5px;
      --shadow: var(--off) var(--off) 0 var(--accent-2); --shadow-press: 2px 2px 0 var(--accent-2);
      --dur: 120ms; --ease: cubic-bezier(.2, .8, .2, 1);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--paper); color: var(--ink); overflow-x: clip; }
    body {
      font-family: var(--font-body); line-height: 1.5;
      -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
      min-height: 100vh;
    }
    button, input, select { font: inherit; color: inherit; }
    button { background: none; border: 0; padding: 0; cursor: pointer; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; transition: none; }
    .hidden { display: none !important; }
    svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; flex-shrink: 0; }

    .view { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 104px); }
    .top { display: flex; align-items: center; gap: 12px; min-height: 52px; margin-bottom: 16px; }
    .top h1, #sheet h2, .welcome-txt h1 { text-wrap: balance; }
    .top h1 { flex: 1; min-width: 0; margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; text-transform: uppercase; line-height: 1.02; overflow-wrap: break-word;
      text-shadow: -2px 0 0 var(--accent-2), 2px 0 0 var(--accent); }
    .icon-btn { width: 48px; height: 48px; display: grid; place-items: center; border-radius: var(--radius); color: var(--ink); border: var(--bar) solid transparent; }
    .icon-btn:active { background: var(--paper-3); }
    .wordmark { font-family: var(--font-display); font-weight: 400; text-transform: uppercase; letter-spacing: 0; line-height: 1.02;
      text-shadow: -2px 0 0 var(--accent-2), 2px 0 0 var(--accent); }
    .top h1 .wordmark { font-size: 1.45rem; }
    .tagline { color: var(--ink-2); font-size: 1.05rem; margin: 0; }

    .card { background: var(--paper-2); border: var(--bar) solid var(--rule); border-radius: var(--radius); padding: 16px; }
    .stack > * + * { margin-top: 14px; }
    .muted { color: var(--muted); }
    .small { font-size: .875rem; }
    .dot { display: none; }
    .status-on { color: var(--accent); font-weight: 700; }

    /* power button: the press surface, square */
    .power { width: 56px; height: 56px; border-radius: var(--radius); display: grid; place-items: center; flex-shrink: 0;
      background: var(--paper-3); color: var(--ink); border: var(--bar) solid var(--ink); box-shadow: var(--shadow);
      transition: translate var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
    .power:active { translate: 3px 3px; box-shadow: var(--shadow-press); }
    .power.on { background: var(--accent); color: var(--accent-ink); }
    .power svg.i { width: 26px; height: 26px; stroke-width: 2.4; }

    /* device card on home */
    .device { display: flex; align-items: center; gap: 14px; }
    .device-ic { width: 44px; height: 44px; display: grid; place-items: center; color: var(--accent); }
    .device-ic svg.i { width: 32px; height: 32px; }
    .device-txt { flex: 1; min-width: 0; text-align: left; }
    .device-name { font-size: 1.15rem; font-weight: 900; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .preview { position: relative; margin-top: 16px; border-radius: var(--radius); border: var(--bar) solid var(--ink); overflow: hidden; aspect-ratio: 16 / 9; background: var(--paper); }
    .preview img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .preview .tint { position: absolute; inset: 0; transition: background-color .25s; pointer-events: none; }
    .pv-chip { margin: 8px 2px 0; font-size: .8rem; color: var(--muted); text-align: center; }
    .preview { touch-action: manipulation; user-select: none; -webkit-user-select: none; }

    /* scenes row: square keys, the chosen one lit like a cursor */
    .scenes { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 10px; margin: 16px -2px 0; scrollbar-width: none; }
    .scenes::-webkit-scrollbar { display: none; }
    .scene { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 72px; }
    .scene .ring { width: 64px; height: 64px; border-radius: var(--radius); display: grid; place-items: center; background: var(--paper-3); border: var(--bar) solid var(--rule); color: var(--ink); }
    .scene .ring svg.i { filter: drop-shadow(1px 1px 0 var(--paper)) drop-shadow(-1px -1px 0 var(--paper)); }
    .scene span { font-family: var(--font-figure); font-size: .72rem; color: var(--ink-2); white-space: nowrap; }
    .scene[aria-pressed="true"] .ring { border: 3px solid var(--accent); box-shadow: var(--shadow); }
    .scene[aria-pressed="true"] span { color: var(--accent); }

    /* sliders: square track, square thumb with the red offset */
    .slider-card { display: grid; grid-template-columns: 32px 1fr auto; align-items: center; gap: 6px 12px; }
    .slider-card .lbl { font-weight: 700; }
    .slider-card .val { color: var(--accent); font-family: var(--font-number); font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
    .slider-card input { grid-column: 2 / 4; }
    .slider-card .ic { grid-row: 1 / 3; align-self: center; }
    .slider-card .ic svg.i { color: var(--thumb, currentColor); width: 28px; height: 28px; }
    .ic-red { color: var(--accent-2-ink); } .ic-cream { color: var(--ink); } .ic-amber { color: var(--accent); }
    /* the bar is the setting's own spectrum, lit up to the value; the thumb wears the value's colour */
    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 36px; background: transparent; margin: 0; --p: 50%;
      --spec: linear-gradient(90deg, var(--c1, var(--accent-2)), var(--c2, var(--accent))); }
    input[type=range]::-webkit-slider-runnable-track { height: 12px; border-radius: 0; border: var(--bar) solid var(--rule);
      background: linear-gradient(90deg, transparent var(--p), var(--paper) var(--p)), var(--spec); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -9px; border-radius: 2px;
      background: var(--thumb, var(--ink)); border: var(--bar) solid var(--ink); box-shadow: 3px 3px 0 var(--accent-2); }
    input[type=range]:active::-webkit-slider-thumb { box-shadow: 1px 1px 0 var(--accent-2); }
    input[type=range]::-moz-range-track { height: 12px; background: var(--paper); border: var(--bar) solid var(--rule); }
    input[type=range]::-moz-range-progress { height: 12px; background: var(--spec); }
    input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border: var(--bar) solid var(--ink); border-radius: 2px; background: var(--thumb, var(--ink)); }
    input[type=range]:focus-visible { outline-offset: 2px; }

    .row-link { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; min-height: 48px; }
    .row-link .grow { flex: 1; min-width: 0; }
    .row-link .t { font-weight: 700; }
    .chev { color: var(--muted); }
    button.card.row-link:active { background: var(--accent); color: var(--accent-ink); }
    button.card.row-link:active span { color: var(--accent-ink); }

    .slider-card.nic { grid-template-columns: 1fr auto; }
    .slider-card.nic input { grid-column: 1 / 3; }
    input[type=range]:disabled { cursor: not-allowed; opacity: .5; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { min-height: 44px; padding: 8px 14px; border-radius: 0; background: var(--paper-3); border: var(--bar) solid var(--rule); color: var(--ink-2); font-weight: 700; font-size: .9rem; }
    .chip[aria-pressed="true"] { border-color: var(--ink); color: var(--accent-ink); background: var(--accent); }
    .chip.reset { color: var(--accent); }
    .au-ctl.off { opacity: .45; pointer-events: none; }

    .banner { display: flex; gap: 12px; align-items: center; text-decoration: none; border-color: var(--accent-2); background: var(--paper-2); font-weight: 700; }

    /* lists (scenes, devices): menu rows, the active one is the cursor */
    .list > * + * { margin-top: 12px; }
    .item { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 12px; border-radius: var(--radius); background: var(--paper-2); border: var(--bar) solid var(--rule); }
    .item.active { border-color: var(--ink); background: var(--accent); color: var(--accent-ink); }
    .item.active .d, .item.active .muted, .item.active .status-on, .item.active .dev-ic { color: var(--accent-ink); }
    .thumb { width: 84px; height: 64px; border-radius: 2px; flex-shrink: 0; display: grid; place-items: center; color: var(--ink); position: relative; overflow: hidden; border: var(--bar) solid var(--ink); }
    .thumb svg.i { width: 30px; height: 30px; filter: drop-shadow(1px 1px 0 var(--paper)); }
    .thumb.dashed { background: transparent; border: var(--bar) dashed var(--rule); color: var(--muted); }
    .item .grow { flex: 1; min-width: 0; }
    .item .t { font-weight: 900; font-size: 1.05rem; letter-spacing: -.01em; }
    .item .d { color: var(--muted); font-size: .875rem; }
    .radio { width: 24px; height: 24px; border-radius: 0; border: var(--bar) solid var(--muted); display: grid; place-items: center; flex-shrink: 0; }
    .radio.on { background: var(--paper); border-color: var(--paper); color: var(--accent); }
    .radio svg.i { width: 15px; height: 15px; stroke-width: 3; }
    .dev-ic { width: 56px; height: 56px; display: grid; place-items: center; color: var(--ink-2); flex-shrink: 0; }
    .dev-ic svg.i { width: 36px; height: 36px; }
    .add-ic { width: 44px; height: 44px; border-radius: var(--radius); display: grid; place-items: center; background: var(--paper-3); border: var(--bar) solid var(--rule); color: var(--ink); flex-shrink: 0; margin: 6px; }

    /* buttons: the press surface */
    .btn { text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px; padding: 0 16px;
      border-radius: var(--radius); border: var(--bar) solid var(--ink); font-weight: 700; font-size: 1.05rem; box-shadow: var(--shadow);
      transition: translate var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
    .btn:active { translate: 3px 3px; box-shadow: var(--shadow-press); }
    .btn-grad { background: var(--accent); color: var(--accent-ink); }
    .btn-soft { background: transparent; color: var(--ink); }
    .btn-danger { background: transparent; color: var(--accent-2-ink); border-color: var(--accent-2); box-shadow: none; }
    .link-btn { color: var(--ink); font-weight: 700; padding: 12px; display: inline-flex; gap: 8px; align-items: center; text-decoration: underline 2px var(--accent); text-underline-offset: 4px; }
    .seg { display: flex; gap: 0; border: var(--bar) solid var(--rule); border-radius: var(--radius); overflow: hidden; }
    .seg button { flex: 1; min-height: 44px; color: var(--muted); font-weight: 700; }
    .seg button + button { border-left: var(--bar) solid var(--rule); }
    .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
    .field { display: block; width: 100%; min-height: 52px; padding: 12px 14px; border-radius: 0; border: var(--bar) solid var(--muted); background: var(--paper); }
    .field:focus-visible { outline-offset: 0; border-color: var(--accent); }
    .switch { position: relative; width: 56px; height: 30px; flex-shrink: 0; }
    .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .switch span { position: absolute; inset: 0; border-radius: 2px; background: var(--paper-3); border: var(--bar) solid var(--rule); pointer-events: none; }
    .switch span::before { content: ""; position: absolute; left: 2px; top: 2px; width: 22px; height: 22px; border-radius: 1px; background: var(--muted); transition: transform var(--dur) var(--ease); }
    .switch input:checked + span { background: var(--accent-2); border-color: var(--ink); }
    .switch input:checked + span::before { transform: translateX(26px); background: var(--accent); }
    .switch input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 3px; }

    /* welcome */
    #v-welcome { padding-bottom: calc(env(safe-area-inset-bottom) + 28px); display: flex; flex-direction: column; min-height: 100vh; }
    .hero { position: relative; margin: 8px auto 0; width: min(72%, 300px); }
    .hero img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; }
    .welcome-txt { text-align: left; margin-top: 32px; }
    .welcome-txt h1 { font-size: clamp(1.5rem, 8.6vw, 3rem); margin: 0 0 12px; overflow-wrap: break-word; min-width: 0; }
    .welcome-actions { margin-top: auto; padding-top: 26px; }
    .choice { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px; border-radius: var(--radius); background: var(--paper-2); border: var(--bar) solid var(--rule); margin-top: 12px; }
    .choice:active { background: var(--accent); color: var(--accent-ink); }
    .choice:active span { color: var(--accent-ink); }
    .choice .grow { flex: 1; }
    .choice .t { font-weight: 900; font-size: 1.05rem; }

    .check-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 12px; border-radius: var(--radius); background: var(--paper-3); border: var(--bar) solid var(--rule); font-weight: 700; }
    .check-row .grow { flex: 1; min-width: 0; }
    .check-row .box { width: 24px; height: 24px; border-radius: 0; border: var(--bar) solid var(--muted); display: grid; place-items: center; flex-shrink: 0; color: var(--accent-ink); }
    .check-row[aria-checked="true"] .box { background: var(--accent); border-color: var(--accent); }
    .check-row .box svg.i { width: 15px; height: 15px; stroke-width: 3; }
    .check-row .dev-ic { width: 36px; height: 36px; } .check-row .dev-ic svg.i { width: 26px; height: 26px; }
    .sync-card { display: flex; align-items: center; gap: 14px; }
    .types { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .type-opt { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border-radius: var(--radius); background: var(--paper-3); border: var(--bar) solid var(--rule); color: var(--ink-2); font-size: .82rem; font-weight: 700; }
    .type-opt svg.i { width: 28px; height: 28px; }
    .type-opt[aria-pressed="true"] { border-color: var(--ink); color: var(--accent-ink); background: var(--accent); }

    /* setup checklist */
    .step { display: flex; gap: 14px; align-items: flex-start; }
    .step-n { width: 40px; height: 40px; border-radius: var(--radius); display: grid; place-items: center; flex-shrink: 0; font-family: var(--font-figure); font-size: 1.2rem; background: var(--paper-3); border: var(--bar) solid var(--ink); color: var(--ink); }
    .step-n.done { background: var(--accent); color: var(--accent-ink); }
    .step-n svg.i { width: 20px; height: 20px; stroke-width: 3; }
    .step .grow { flex: 1; min-width: 0; }
    .step .t { font-weight: 900; font-size: 1.05rem; }
    .tag { display: inline-block; font-size: .75rem; font-weight: 700; padding: 1px 7px; border-radius: 0; margin-left: 8px; vertical-align: 2px; }
    .tag.req { border: 1px solid var(--accent-2-ink); color: var(--accent-2-ink); }
    .tag.rec { border: 1px solid var(--accent); color: var(--accent); }
    .step .btn { margin-top: 12px; min-height: 48px; font-size: .95rem; }
    .btn[disabled] { background: var(--paper-3); color: var(--muted); border-color: var(--rule); box-shadow: none; cursor: not-allowed; }

    /* bottom navigation: a solid bar, the current tab lit gold under a top bar */
    #tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: space-around;
      padding: 0 8px calc(env(safe-area-inset-bottom) + 6px); background: var(--paper); border-top: var(--bar) solid var(--rule); }
    #tabs button { flex: 1; max-width: 120px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 6px; color: var(--muted); font-family: var(--font-figure); font-size: .7rem; border-top: 3px solid transparent; margin-top: -2px; }
    #tabs button[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); }

    /* bottom sheet */
    #sheet-wrap { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--paper) 82%, transparent); display: flex; align-items: flex-end; justify-content: center; }
    #sheet { width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: var(--paper-2); border-radius: var(--radius) var(--radius) 0 0; border: var(--bar) solid var(--ink); border-bottom: 0;
      padding: 10px 18px calc(env(safe-area-inset-bottom) + 22px); }
    #sheet .grab { width: 44px; height: 4px; background: var(--rule); margin: 0 auto 16px; }
    #sheet h2 { margin: 0 0 14px; font-family: var(--font-display); font-weight: 400; font-size: 1.25rem; text-transform: uppercase; line-height: 1.05; overflow-wrap: break-word; }
    #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 96px); transform: translateX(-50%); z-index: 30;
      background: var(--accent); color: var(--accent-ink); padding: 10px 18px; border: var(--bar) solid var(--ink); border-radius: var(--radius); font-size: .9rem; font-weight: 700; box-shadow: var(--shadow); }
    ol.steps { padding-left: 20px; margin: 0; color: var(--ink-2); } ol.steps li + li { margin-top: 6px; }

    day-rhythm {
      display: block;
      --dr-bg: var(--paper); --dr-surface: var(--paper-2); --dr-surface-soft: var(--paper-3);
      --dr-ink: var(--ink); --dr-muted: var(--muted); --dr-accent: var(--accent);
      --dr-accent-soft: var(--paper-3); --dr-accent-ink: var(--accent-ink); --dr-focus: var(--focus);
      --dr-danger: var(--accent-2-ink); --dr-border: var(--rule); --dr-shadow: var(--shadow);
      --dr-overlay: color-mix(in srgb, var(--paper) 82%, transparent); --dr-now: var(--accent-2);
    }
    @media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; } }
  </style>
</head>
<body>

<!-- Welcome: shown on the first start -->
<section id="v-welcome" class="view hidden">
  <div class="hero"><img src="/icon-512.png" alt=""></div>
  <div class="welcome-txt">
    <h1><span class="wordmark">MidnightBeam</span></h1>
    <p class="tagline" data-t="tagline1"></p>
  </div>
  <div class="welcome-actions">
    <button id="w-here" class="choice" type="button">
      <span class="dev-ic" data-icon="phone"></span>
      <span class="grow"><span class="t" data-t="useHere"></span><br><span class="muted small" data-t="useHereSub"></span></span>
      <span class="chev" data-icon="chev"></span>
    </button>
    <button id="w-connect" class="choice" type="button">
      <span class="dev-ic" data-icon="tv"></span>
      <span class="grow"><span class="t" data-t="connectTv"></span><br><span class="muted small" data-t="connectTvSub"></span></span>
      <span class="chev" data-icon="chev"></span>
    </button>
  </div>
</section>

<!-- Setup of this device: the permissions the filter needs -->
<section id="v-setup" class="view hidden">
  <div class="top">
    <button class="icon-btn" type="button" id="su-back" data-al="back" data-icon="back"></button>
    <h1 data-t="setupTitle"></h1>
  </div>
  <div class="stack">
    <p class="muted" style="margin:0" data-t="setupIntro"></p>
    <div class="card step">
      <span class="step-n" id="su-n1">1</span>
      <div class="grow">
        <div class="t"><span data-t="stOverlay"></span><span class="tag req" data-t="required"></span></div>
        <div class="small muted" id="su-t1"></div>
        <a class="btn btn-grad" id="su-b1" href="midnightbeam-app://overlay" data-t="allow"></a>
      </div>
    </div>
    <div class="card step" id="su-s2">
      <span class="step-n" id="su-n2">2</span>

    Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (e) { var v = L[e.getAttribute('data-t')]; if (typeof v === 'string') e.textContent = v; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-al]'), function (e) { e.setAttribute('aria-label', L[e.getAttribute('data-al')]); });
    $('sched-on').setAttribute('aria-label', L.schedTitle);
    $('st-audio').setAttribute('aria-label', L.audioSetting); $('au-on').setAttribute('aria-label', L.audioEffects);
    renderDevice(); renderSceneRow(); summary(); renderAudioRow();
    if (view === 'audio') { auSig = ''; renderAudio(); }
    if (view === 'devices') renderDevices();
    if (view === 'scenes') renderScenes();
    if (view === 'settings') renderSettings();
    if (view === 'setup') renderSetup();
    if (scheduleLoaded) { var v = rhythm.getValue(), d = rhythm.days; rhythm.config = config(); setValue(v); rhythm.days = d; }
  }

  // ---- Start ----
  paintIcons();
  applyTexts(); labels();
  ['r-red', 'r-bright', 'r-temp'].forEach(function (id) { paintRange($(id)); });
  rhythm.config = config(); setValue(defaultValue());
  showView(store('mb_welcomed') ? 'home' : 'welcome');
  loadApp(); loadDevices(); refresh(); loadScheduleSummary(); loadAudioSummary();
  setInterval(function () {
    if (document.hidden) return;
    if (!pending) refresh();
    if (view === 'devices') probeAll();
  }, 10000);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { flushSave(); return; }
    // the app restarts its local server when it comes back: give it a moment
    setTimeout(function () {
      loadApp(); refresh(); loadDevices();
      if (view === 'devices') probeAll();
      if (view === 'audio') loadAudio(); else loadAudioSummary();
      if (view === 'schedule' && !saveTimer && !saving && !rhythm.editing) loadScheduleAll(); else loadScheduleSummary();
    }, 600);
  });
})();
</script>
</body>
</html>

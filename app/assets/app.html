<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0807">
  <title>MidnightBeam</title>
  <!-- The phone app's own page (served on loopback by the app only). The TV and the browser remote use remote.html. -->
  <style>
    :root {
      --bg: #0a0807; --bg2: #100c0b; --card: #161110; --card2: #1f1815; --line: rgb(255 255 255 / 7%);
      --ink: #f6efe9; --muted: #a8978c; --red: #ff4d4d; --red2: #ff6b4d; --cream: #ffd9b3;
      --green: #3ddc97; --radius: 22px;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body {
      font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif; line-height: 1.4;
      -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
      min-height: 100vh;
      background: radial-gradient(ellipse 80% 45% at 90% -5%, rgb(255 107 77 / 10%), transparent 70%),
                  radial-gradient(ellipse 70% 40% at 0% 0%, rgb(255 77 77 / 14%), transparent 70%), var(--bg);
    }
    button, input, select { font: inherit; color: inherit; }
    button { background: none; border: 0; padding: 0; cursor: pointer; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid var(--red2); outline-offset: 3px; }
    .hidden { display: none !important; }
    svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

    .view { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 96px); }
    .top { display: flex; align-items: center; gap: 12px; min-height: 48px; margin-bottom: 14px; }
    .top h1 { flex: 1; margin: 0; font-size: 1.6rem; font-weight: 600; letter-spacing: -.02em; }
    .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--ink); }
    .icon-btn:active { background: var(--card2); }
    .wordmark { font-weight: 700; letter-spacing: -.03em;
      background: linear-gradient(90deg, #ffe3d1 0%, #ff8a6b 38%, #ff5a5a 52%, #ffb38a 62%, #ffd9b3 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 14px rgb(255 77 77 / 35%)); }
    .spark { color: var(--red); font-size: .8em; vertical-align: super; margin-left: 2px; text-shadow: 0 0 10px var(--red); }
    .tagline { font-family: ui-monospace, "Roboto Mono", "DejaVu Sans Mono", monospace; color: #ddd0c7; font-size: .95rem; }

    .card { background: linear-gradient(180deg, var(--card), var(--bg2)); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
    .stack > * + * { margin-top: 12px; }
    .muted { color: var(--muted); }
    .small { font-size: .85rem; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
    .dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .status-on { color: var(--green); }

    /* power button */
    .power { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
      background: #2c221e; color: #d9ccc4; transition: background .2s, box-shadow .2s; }
    .power.on { background: radial-gradient(circle at 35% 30%, #ff8080, var(--red) 60%); color: #fff; box-shadow: 0 0 22px rgb(255 77 77 / 55%); }
    .power svg.i { width: 26px; height: 26px; stroke-width: 2.2; }

    /* device card on home */
    .device { display: flex; align-items: center; gap: 14px; }
    .device-ic { width: 44px; height: 44px; display: grid; place-items: center; color: var(--red2); }
    .device-ic svg.i { width: 32px; height: 32px; stroke-width: 1.6; }
    .device-txt { flex: 1; min-width: 0; text-align: left; }
    .device-name { font-size: 1.1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .preview { position: relative; margin-top: 14px; border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 9; background: #000; }
    .preview img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .preview .tint, .preview .dim { position: absolute; inset: 0; transition: background .25s; pointer-events: none; }

    /* scenes row */
    .scenes { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 6px; margin: 16px -2px 4px; scrollbar-width: none; }
    .scenes::-webkit-scrollbar { display: none; }
    .scene { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 72px; }
    .scene .ring { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--card2); border: 1px solid var(--line); color: #eadfd8; transition: .2s; }
    .scene span { font-size: .8rem; color: #ddd0c7; white-space: nowrap; }
    .scene[aria-pressed="true"] .ring { background: radial-gradient(circle at 40% 30%, #6b2a33, #3a1720); border: 2px solid var(--red); color: #ffd0c4; box-shadow: 0 0 18px rgb(255 77 77 / 45%); }
    .scene[aria-pressed="true"] span { color: var(--ink); font-weight: 600; }

    /* sliders */
    .slider-card { display: grid; grid-template-columns: 32px 1fr auto; align-items: center; gap: 4px 12px; }
    .slider-card .lbl { font-weight: 600; }
    .slider-card .val { color: #ddd0c7; font-variant-numeric: tabular-nums; }
    .slider-card input { grid-column: 2 / 4; }
    .slider-card .ic { grid-row: 1 / 3; align-self: center; }
    .ic-red { color: var(--red); } .ic-cream { color: var(--cream); } .ic-amber { color: #ffb15c; }
    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; margin: 0; --p: 50%; --c1: var(--red); --c2: var(--red2); }
    input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 6px; background: linear-gradient(90deg, var(--c1), var(--c2) var(--p), #2c221e var(--p)); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -9px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 5px rgb(255 255 255 / 12%), 0 2px 8px rgb(0 0 0 / 50%); }
    input[type=range]::-moz-range-track { height: 6px; border-radius: 6px; background: #2c221e; }
    input[type=range]::-moz-range-progress { height: 6px; border-radius: 6px; background: linear-gradient(90deg, var(--c1), var(--c2)); }
    input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border: 0; border-radius: 50%; background: #fff; }
    #r-red { --c1: #ff3b3b; --c2: #ff7a5c; }
    #r-bright { --c1: #b9a48e; --c2: #ffe2bd; }
    #r-temp { --c1: #ff7a2e; --c2: #ffc98a; }

    .row-link { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; }
    .row-link .grow { flex: 1; min-width: 0; }
    .row-link .t { font-weight: 600; }
    .chev { color: var(--muted); }

    .slider-card.nic { grid-template-columns: 1fr auto; }
    .slider-card.nic input { grid-column: 1 / 3; }
    input[type=range]:disabled { cursor: not-allowed; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { min-height: 40px; padding: 8px 14px; border-radius: 999px; background: var(--card2); border: 1px solid var(--line); color: #ddd0c7; font-weight: 500; font-size: .9rem; }
    .chip[aria-pressed="true"] { border: 2px solid var(--red); padding: 7px 13px; color: var(--ink); background: #2e1915; }
    .chip.reset { color: #ffb38a; }
    .au-ctl.off { opacity: .45; pointer-events: none; }

    .banner { display: flex; gap: 12px; align-items: center; text-decoration: none; border-color: rgb(255 77 77 / 45%); background: linear-gradient(180deg, #2a1418, #1a0f0d); }

    /* lists (scenes, devices) */
    .list > * + * { margin-top: 12px; }
    .item { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 12px; border-radius: var(--radius); background: linear-gradient(180deg, var(--card), var(--bg2)); border: 1px solid var(--line); }
    .item.active { border-color: rgb(255 77 77 / 55%); background: linear-gradient(180deg, #221512, #170f0d); }
    .thumb { width: 84px; height: 64px; border-radius: 14px; flex-shrink: 0; display: grid; place-items: center; color: #fff; position: relative; overflow: hidden; }
    .thumb svg.i { width: 30px; height: 30px; filter: drop-shadow(0 1px 3px rgb(0 0 0 / 60%)); }
    .thumb.dashed { background: transparent; border: 1.5px dashed #4a3a34; color: var(--muted); }
    .item .grow { flex: 1; min-width: 0; }
    .item .t { font-weight: 600; font-size: 1.02rem; }
    .item .d { color: var(--muted); font-size: .85rem; }
    .radio { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #5a4842; display: grid; place-items: center; flex-shrink: 0; }
    .radio.on { background: var(--red); border-color: var(--red); color: #fff; }
    .radio svg.i { width: 15px; height: 15px; stroke-width: 3; }
    .dev-ic { width: 56px; height: 56px; display: grid; place-items: center; color: #d9ccc4; flex-shrink: 0; }
    .dev-ic svg.i { width: 36px; height: 36px; stroke-width: 1.5; }
    .add-ic { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: #2c211d; color: #eadfd8; flex-shrink: 0; margin: 6px; }

    /* buttons */
    .btn { text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px; border-radius: 999px; font-weight: 600; font-size: 1.05rem; }
    .btn-grad { background: linear-gradient(90deg, #ff4d4d, #ff6b4d 50%, #ffa53d); color: #fff; box-shadow: 0 8px 28px rgb(255 107 77 / 30%); }
    .btn-soft { background: var(--card2); color: var(--ink); border: 1px solid var(--line); }
    .btn-danger { background: transparent; color: #ff8a7a; border: 1px solid rgb(255 77 77 / 40%); }
    .link-btn { color: #ffb38a; font-weight: 500; padding: 12px; display: inline-flex; gap: 8px; align-items: center; }
    .seg { display: flex; gap: 6px; background: var(--card2); padding: 4px; border-radius: 999px; }
    .seg button { flex: 1; min-height: 40px; border-radius: 999px; color: var(--muted); font-weight: 600; }
    .seg button[aria-pressed="true"] { background: #3d2b24; color: var(--ink); }
    .field { display: block; width: 100%; min-height: 50px; padding: 12px 16px; border-radius: 14px; border: 1px solid #3a2d28; background: #0e0a09; }
    .switch { position: relative; width: 52px; height: 30px; flex-shrink: 0; }
    .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .switch span { position: absolute; inset: 0; border-radius: 99px; background: #3a2c27; transition: .2s; pointer-events: none; }
    .switch span::before { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: .2s; }
    .switch input:checked + span { background: var(--red); }
    .switch input:checked + span::before { transform: translateX(22px); }

    /* welcome */
    #v-welcome { padding-bottom: calc(env(safe-area-inset-bottom) + 28px); display: flex; flex-direction: column; min-height: 100vh; }
    .hero { position: relative; margin: -18px -16px 0; }
    .hero img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; -webkit-mask-image: linear-gradient(180deg, #000 70%, transparent); mask-image: linear-gradient(180deg, #000 70%, transparent); }
    .welcome-txt { text-align: center; margin-top: -12px; }
    .welcome-txt h1 { font-size: 2.6rem; margin: 0 0 10px; }
    .welcome-actions { margin-top: auto; padding-top: 26px; }
    .choice { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); margin-top: 12px; }
    .choice .grow { flex: 1; }
    .choice .t { font-weight: 600; }

    .check-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 16px; background: var(--card2); border: 1px solid var(--line); }
    .check-row .grow { flex: 1; min-width: 0; }
    .check-row .box { width: 24px; height: 24px; border-radius: 7px; border: 2px solid #5a4842; display: grid; place-items: center; flex-shrink: 0; color: #fff; }
    .check-row[aria-checked="true"] .box { background: var(--red); border-color: var(--red); }
    .check-row .box svg.i { width: 15px; height: 15px; stroke-width: 3; }
    .check-row .dev-ic { width: 36px; height: 36px; } .check-row .dev-ic svg.i { width: 26px; height: 26px; }
    .sync-card { display: flex; align-items: center; gap: 14px; }
    .types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .type-opt { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border-radius: 16px; background: var(--card2); border: 1px solid var(--line); color: #ddd0c7; font-size: .82rem; }
    .type-opt svg.i { width: 28px; height: 28px; }
    .type-opt[aria-pressed="true"] { border: 2px solid var(--red); color: var(--ink); background: #2e1915; }

    /* setup checklist */
    .step { display: flex; gap: 14px; align-items: flex-start; }
    .step-n { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; font-weight: 700; background: #2c221e; color: var(--ink); }
    .step-n.done { background: var(--green); color: #06231a; }
    .step-n svg.i { width: 18px; height: 18px; stroke-width: 3; }
    .step .grow { flex: 1; min-width: 0; }
    .step .t { font-weight: 600; font-size: 1.05rem; }
    .tag { display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; margin-left: 6px; vertical-align: 2px; }
    .tag.req { background: rgb(255 77 77 / 18%); color: #ff9a8a; }
    .tag.rec { background: rgb(255 177 92 / 18%); color: #ffb38a; }
    .step .btn { margin-top: 10px; min-height: 46px; font-size: .95rem; }
    .btn[disabled] { opacity: .45; }

    /* bottom navigation */
    #tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: space-around;
      padding: 8px 8px calc(env(safe-area-inset-bottom) + 8px); background: rgb(10 8 7 / 94%); border-top: 1px solid var(--line);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
    #tabs button { flex: 1; max-width: 120px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: #a8978c; font-size: .78rem; }
    #tabs button[aria-current="page"] { color: var(--red); }
    #tabs button[aria-current="page"] svg.i { filter: drop-shadow(0 0 6px rgb(255 77 77 / 70%)); }

    /* bottom sheet */
    #sheet-wrap { position: fixed; inset: 0; z-index: 20; background: rgb(0 0 0 / 70%); display: flex; align-items: flex-end; justify-content: center; }
    #sheet { width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: #15100e; border-radius: 26px 26px 0 0; border: 1px solid var(--line);
      padding: 10px 18px calc(env(safe-area-inset-bottom) + 22px); }
    #sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: #4a3a34; margin: 0 auto 14px; }
    #sheet h2 { margin: 0 0 12px; font-size: 1.3rem; }
    #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 92px); transform: translateX(-50%); z-index: 30;
      background: #2a201c; color: var(--ink); padding: 10px 18px; border-radius: 999px; font-size: .9rem; box-shadow: 0 6px 20px rgb(0 0 0 / 40%); }
    ol.steps { padding-left: 20px; margin: 0; color: #ddd0c7; } ol.steps li + li { margin-top: 6px; }

    day-rhythm {
      display: block;
      --dr-bg: var(--bg); --dr-surface: var(--card); --dr-surface-soft: var(--card2);
      --dr-ink: var(--ink); --dr-muted: var(--muted); --dr-accent: var(--red2);
      --dr-accent-soft: #3a1f1a; --dr-accent-ink: #0a0807; --dr-focus: var(--red2);
      --dr-danger: #ff8a7a; --dr-border: #3a2d28; --dr-shadow: 0 12px 40px rgb(0 0 0 / 35%);
      --dr-overlay: #0a0807cc; --dr-now: var(--red);
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>

<!-- Welcome: shown on the first start -->
<section id="v-welcome" class="view hidden">
  <div class="hero"><img src="/icon-512.png" alt=""></div>
  <div class="welcome-txt">
    <h1><span class="wordmark">MidnightBeam</span><span class="spark">✦</span></h1>
    <p class="tagline" data-t="tagline1"></p>
  </div>
  <div class="welcome-actions">
    <button id="w-here" class="choice" type="button">
      <span class="dev-ic" data-icon="phone"></span>
      <span class="grow"><span class="t" data-t="useHere"></span><br><span class="muted small" data-t="useHereSub"></span></span>
      <span class="chev" data-icon="chev"></span>
    </button>
    <button id="w-connect" class="choice" type="button">
      <span class="dev-ic" data-icon="tv"></span>
      <span class="grow"><span class="t" data-t="connectTv"></span><br><span class="muted small" data-t="connectTvSub"></span></span>
      <span class="chev" data-icon="chev"></span>
    </button>
  </div>
</section>

<!-- Setup of this device: the permissions the filter needs -->
<section id="v-setup" class="view hidden">
  <div class="top">
    <button class="icon-btn" type="button" id="su-back" data-al="back" data-icon="back"></button>
    <h1 data-t="setupTitle"></h1>
  </div>
  <div class="stack">
    <p class="muted" style="margin:0" data-t="setupIntro"></p>
    <div class="card step">
      <span class="step-n" id="su-n1">1</span>
      <div class="grow">
        <div class="t"><span data-t="stOverlay"></span><span class="tag req" data-t="required"></span></div>
        <div class="small muted" id="su-t1"></div>
        <a class="btn btn-grad" id="su-b1" href="midnightbeam-app://overlay" data-t="allow"></a>
      </div>
    </div>
    <div class="card step" id="su-s2">
      <span class="step-n" id="su-n2">2</span>
      <div class="grow">
        <div class="t"><span data-t="stA11y"></span><span class="tag rec" data-t="recommended"></span></div>
        <div class="small muted" id="su-t2"></div>
        <a class="btn btn-soft" id="su-b2" href="midnightbeam-app://accessibility" data-t="enable"></a>
      </div>
    </div>
    <button class="btn btn-grad" type="button" id="su-done" data-t="setupDone"></button>
    <p class="small muted" style="margin:0;text-align:center" id="su-hint"></p>
    <button class="link-btn" type="button" id="su-tv" style="width:100%;justify-content:center"><span data-t="orConnect"></span></button>
  </div>
</section>

<!-- Home -->
<section id="v-home" class="view hidden">
  <div class="top">
    <h1><span class="wordmark">MidnightBeam</span><span class="spark">✦</span></h1>
    <button class="icon-btn" type="button" data-go="settings" data-al="settings" data-icon="gear"></button>
  </div>
  <div class="stack">
    <a id="perm-banner" class="card banner hidden" href="#" data-sub="setup">
      <span class="ic-red" data-icon="alert"></span><span class="small" data-t="permBanner"></span>
    </a>
    <div class="card">
      <div class="device">
        <button id="h-dev" class="device" type="button" style="flex:1;min-width:0">
          <span class="device-ic" id="h-dev-ic"></span>
          <span class="device-txt">
            <span class="device-name" id="h-dev-name"></span><br>
            <span class="small" id="h-dev-status"></span>
          </span>
        </button>
        <button id="h-power" class="power" type="button" data-al="power" data-icon="power"></button>
      </div>
      <div class="preview" aria-hidden="true"><img src="/art.jpg" alt=""><div class="tint" id="pv-tint"></div><div class="dim" id="pv-dim"></div></div>
      <div class="scenes" id="h-scenes" role="group"></div>
    </div>
    <div class="card slider-card">
      <span class="ic ic-red" data-icon="sun"></span><label class="lbl" for="r-red" data-t="red"></label><span class="val" id="v-red"></span>
      <input id="r-red" type="range" min="0" max="100" step="5">
    </div>
    <div class="card slider-card">
      <span class="ic ic-cream" data-icon="bright"></span><label class="lbl" for="r-bright" data-t="bright"></label><span class="val" id="v-bright"></span>
      <input id="r-bright" type="range" min="5" max="100" step="5">
    </div>
    <div class="card slider-card">
      <span class="ic ic-amber" data-icon="thermo"></span><label class="lbl" for="r-temp" data-t="temp"></label><span class="val" id="v-temp"></span>
      <input id="r-temp" type="range" min="1000" max="4000" step="100">
    </div>
    <button class="card row-link" type="button" data-go="schedule">
      <span class="ic-amber" data-icon="clock"></span>
      <span class="grow"><span class="t" data-t="schedTitle"></span><br><span class="small muted" id="h-sched"></span></span>
      <span class="chev" data-icon="chev"></span>
    </button>
    <button class="card row-link hidden" type="button" id="h-audio-row" data-go="audio">
      <span class="ic-red" data-icon="audio"></span>
      <span class="grow"><span class="t" data-t="audioTitle"></span><br><span class="small muted" id="h-audio"></span></span>
      <span class="chev" data-icon="chev"></span>
    </button>
  </div>
</section>

<!-- Devices -->
<section id="v-devices" class="view hidden">
  <div class="top"><h1 data-t="devices"></h1><button class="icon-btn" type="button" id="d-add-top" data-al="addDevice" data-icon="plus"></button></div>
  <div class="list" id="d-list"></div>
</section>

<!-- Scenes -->
<section id="v-scenes" class="view hidden">
  <div class="top"><h1 data-t="scenes"></h1><button class="icon-btn" type="button" id="s-add-top" data-al="newScene" data-icon="plus"></button></div>
  <div class="list" id="s-list"></div>
</section>

<!-- Settings -->
<section id="v-settings" class="view hidden">
  <div class="top"><h1 data-t="settings"></h1></div>
  <div class="stack">
    <div class="card stack">
      <div class="t" style="font-weight:600" data-t="language"></div>
      <div class="seg" role="group"><button type="button" class="lang" data-lang="auto" data-t="langAuto"></button><button type="button" class="lang" data-lang="en">English</button><button type="button" class="lang" data-lang="it">Italiano</button></div>
    </div>
    <div class="card sync-card">
      <span class="ic-red" data-icon="audio"></span>
      <span class="grow" style="flex:1;min-width:0"><span class="t" style="font-weight:600" data-t="audioSetting"></span><br><span class="small muted" data-t="audioSettingSub"></span></span>
      <label class="switch"><input id="st-audio" type="checkbox"><span></span></label>
    </div>
    <button class="card row-link" type="button" data-sub="setup">
      <span class="ic-red" data-icon="phone"></span>
      <span class="grow"><span class="t" data-t="setupTitle"></span><br><span class="small muted" id="st-setup"></span></span>
      <span class="chev" data-icon="chev"></span>
    </button>
    <div class="card stack">
      <button type="button" class="row-link" id="st-welcome"><span class="grow" data-t="showWelcome"></span><span class="chev" data-icon="chev"></span></button>
      <a class="row-link" href="https://github.com/MadeinTaly/midnightbeam" style="text-decoration:none"><span class="grow" data-t="source"></span><span class="chev" data-icon="chev"></span></a>
      <a class="row-link" href="https://gt.1471995.xyz" style="text-decoration:none"><span class="grow" data-t="support"></span><span class="chev" data-icon="chev"></span></a>
      <p class="small muted" style="margin:0" id="st-version"></p>
    </div>
  </div>
</section>

<!-- Schedule (opened from Home) -->
<section id="v-schedule" class="view hidden">
  <div class="top">
    <button class="icon-btn" type="button" id="sc-back" data-al="back" data-icon="back"></button>
    <h1 data-t="schedTitle"></h1>
  </div>
  <div class="stack">
    <p class="small muted" style="margin:0" data-t="schedSub"></p>
    <div class="card stack">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        <span style="font-weight:600" id="sc-dev"></span>
        <label class="switch"><input id="sched-on" type="checkbox"><span></span></label>
      </div>
      <div>
        <div class="small muted" style="margin-bottom:6px" data-t="weekMode"></div>
        <div class="seg" role="group"><button id="wk-daily" type="button" data-t="weekDaily"></button><button id="wk-week" type="button" data-t="weekWeekly"></button></div>
      </div>
      <div>
        <label class="small muted" for="transition" style="display:block;margin-bottom:6px" data-t="transition"></label>
        <select id="transition" class="field">
          <option value="0" data-t="trOff"></option><option value="15">15 min</option><option value="30">30 min</option><option value="60">60 min</option>
        </select>
        <p class="small muted" style="margin:8px 0 0" data-t="transitionHelp"></p>
      </div>
    </div>
    <day-rhythm id="rhythm"></day-rhythm>
    <p id="save-status" class="small muted" role="status" aria-live="polite"></p>
  </div>
</section>

<!-- Audio (opened from Home, only when enabled in Settings) -->
<section id="v-audio" class="view hidden">
  <div class="top">
    <button class="icon-btn" type="button" id="au-back" data-al="back" data-icon="back"></button>
    <h1 data-t="audioTitle"></h1>
  </div>
  <div class="stack">
    <div id="au-volbox"></div>
    <div class="card" id="au-main">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        <span style="min-width:0"><span style="font-weight:600" id="au-dev"></span><br><span class="small muted" data-t="audioEffects"></span></span>
        <label class="switch"><input id="au-on" type="checkbox"><span></span></label>
      </div>
    </div>
    <div class="stack" id="au-body" role="status" aria-live="polite"></div>
  </div>
</section>

<nav id="tabs" class="hidden">
  <button type="button" data-tab="home"><span data-icon="home"></span><span data-t="home"></span></button>
  <button type="button" data-tab="devices"><span data-icon="tv"></span><span data-t="devices"></span></button>
  <button type="button" data-tab="scenes"><span data-icon="star"></span><span data-t="scenes"></span></button>
  <button type="button" data-tab="settings"><span data-icon="gear"></span><span data-t="settings"></span></button>
</nav>

<div id="sheet-wrap" class="hidden"><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="hidden" role="status" aria-live="polite"></div>

    if (on === weekly) return;
    var v;
    if (on) { var day = stripIds(rhythm.getValue()), w = {}; core.WEEKDAYS.forEach(function (d) { w[d] = JSON.parse(JSON.stringify(day)); }); v = { week: w }; }
    else v = stripIds(rhythm.getDay());
    setValue(v); scheduleSave();
  }
  $('wk-daily').onclick = function () { toWeekly(false); };
  $('wk-week').onclick = function () { toWeekly(true); };
  var status = $('save-status'), saveTimer = null, saving = 0, saveDev = null;
  function payload() {
    var v = rhythm.getValue();
    return { enabled: enabled, value: v, resolved: core.isWeek(v) ? core.resolveWeek(v, rhythm.days) : v, transition: transition };
  }
  function scheduleSave() { clearTimeout(saveTimer); saveDev = cur; status.textContent = L.saving; saveTimer = setTimeout(save, 800); }
  function save() {
    saveTimer = null; saving++;
    var p = payload(), id = saveDev;
    if (id === cur) broadcast('/api/schedule', p);
    return api('/api/schedule', p, id).then(function () {
      if (!saveTimer) status.textContent = '✓ ' + L.saved;
      schedule = p; summary();
      setTimeout(refresh, 400);
    }).catch(function () { status.textContent = '✕ ' + L.error; }).then(function () { saving--; });
  }
  function flushSave() { if (saveTimer) { clearTimeout(saveTimer); save(); } }
  rhythm.addEventListener('change', scheduleSave);
  $('sched-on').addEventListener('change', function () { enabled = $('sched-on').checked; scheduleSave(); });
  $('transition').addEventListener('change', function () { transition = +$('transition').value; scheduleSave(); });
  function loadDays() {
    return api('/api/days').then(function (d) {
      rhythm.days = (Array.isArray(d) ? d : []).map(function (x) { return { id: x.name, name: x.name, slots: normSlots(x.slots) }; });
    }).catch(function () { rhythm.days = []; });
  }
  rhythm.addEventListener('daysave', function (e) {
    broadcast('/api/days', { name: e.detail.name, slots: e.detail.slots });
    e.detail.waitUntil(api('/api/days', { name: e.detail.name, slots: e.detail.slots }).then(loadDays));
  });
  rhythm.addEventListener('daydelete', function (e) {
    broadcast('/api/days', { name: e.detail.day.name, delete: true });
    e.detail.waitUntil(api('/api/days', { name: e.detail.day.name, delete: true }).then(loadDays));
  });
  rhythm.addEventListener('error', function () { status.textContent = '✕ ' + L.error; });
  function loadScheduleSummary() {
    var id = cur;
    return api('/api/schedule').then(function (d) { if (id === cur) { schedule = d; summary(); } return d; }, function () { if (id === cur) { schedule = null; summary(); } return null; });
  }
  function loadScheduleAll() {
    flushSave(); status.textContent = '';
    loadScheduleSummary().then(function (d) {
      if (!d) return;
      var v = normValue(d.value) || normValue(d.resolved) || normValue(d.slots);
      enabled = !!d.enabled; $('sched-on').checked = enabled;
      transition = typeof d.transition === 'number' ? d.transition : 30;
      $('transition').value = String(transition);
      if (!v || (Array.isArray(v) && !v.length)) v = defaultValue();
      rhythm.config = config(); setValue(v); scheduleLoaded = true;
    });
    loadDays();
  }
  // "On · next: Movie at 21:00" for the Home row, from the slots the device applies today.
  function summary() {
    var box = $('h-sched');
    if (!schedule || !schedule.enabled) { box.textContent = L.schedOff; return; }
    var r = schedule.resolved, now = new Date(), slots = r;
    if (r && !Array.isArray(r)) slots = r[core.WEEKDAYS[(now.getDay() + 6) % 7]] || [];
    var mins = now.getHours() * 60 + now.getMinutes(), next = null, first = null;
    (slots || []).map(function (s) { var p = String(s.time).split(':'); return { m: +p[0] * 60 + +p[1], s: s }; })
      .sort(function (a, b) { return a.m - b.m; })
      .forEach(function (x) { if (!first) first = x; if (!next && x.m > mins) next = x; });
    next = next || first;
    if (!next) { box.textContent = L.schedOn; return; }
    var name = next.s.label || (L.models[next.s.model] || '');
    box.textContent = L.schedOn + ' · ' + fmt(L.schedNext, { name: name, time: next.s.time });
  }

  // ---- Audio (optional: global equalizer and effects of the shown device, GET/POST /api/audio) ----
  var au = null, auState = 'loading', auSig = '', auQ = {}, auTimer = null, auPre = {};
  try { auPre = JSON.parse(store('mb_aupre') || '{}') || {}; } catch (e) { auPre = {}; }
  function audioOn() { return store('mb_audio') === '1'; }
  function fmtDb(mb) { var v = Math.round(mb / 10) / 10; return (v > 0 ? '+' : '') + v.toFixed(1) + ' dB'; }
  function fmtHz(f) { return f < 1000 ? Math.round(f) + ' Hz' : (Math.round(f / 100) / 10) + ' kHz'; }
  function bandLevels(d) { return d && d.eq ? d.eq.bands.map(function (b) { return b.level; }) : []; }
  function sameArr(a, b) { if (a.length !== b.length) return false; for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false; return true; }
  // Name of the preset the bands still match (the device does not say which one is active), or null
  function auPresetName() {
    var r = auPre[cur || ''];
    return r && au && au.eq && sameArr(r.bands, bandLevels(au)) ? r.name : null;
  }
  function auFlat() { return !!(au && au.eq) && bandLevels(au).every(function (v) { return v === 0; }); }
  function rememberPreset(name, d) { auPre[cur || ''] = { name: name, bands: bandLevels(d) }; store('mb_aupre', JSON.stringify(auPre)); }
  // The fields to copy to another device, only the ones this device has
  function audioBody(d) {
    if (!d || !d.supported) return null;
    var b = { enabled: !!d.enabled };
    if (d.eq) b.bands = bandLevels(d);
    if (d.bass) b.bass = d.bass.strength;
    if (d.virt) b.virt = d.virt.strength;
    if (d.loud) b.loud = d.loud.gain;
    return b;
  }
  function renderAudioRow() {
    var on = audioOn(), row = $('h-audio-row');
    row.classList.toggle('hidden', !on);
    if (!on) return;
    var vol = auState === 'ok' && au.volume ? L.audioVolume + ' ' + Math.round(au.volume.level / Math.max(1, au.volume.max) * 100) + '%' : '';
    var fx = auState !== 'ok' || !au.supported ? '' : !au.enabled ? L.audioOff
      : L.audioOn + ' · ' + (auPresetName() || (auFlat() ? L.audioFlat : L.audioCustom));
    var t = auState === 'loading' ? '…' : auState !== 'ok' ? L.audioNo : [vol, fx].filter(Boolean).join(' · ');
    $('h-audio').textContent = t;
  }
  function auGot(d) {
    // ok when the device has effects or at least a controllable volume
    if (d && (d.supported || d.volume)) { au = d; auState = 'ok'; } else { au = null; auState = 'unsupported'; }
    renderAudioRow(); if (view === 'audio') renderAudio();
  }
  function loadAudioSummary() {
    if (!audioOn()) return;
    var id = cur;
    return api('/api/audio').then(function (d) { if (id === cur) auGot(d); }, function () { if (id === cur) auGot(null); });
  }
  function loadAudio() {
    if (!au) auState = 'loading';
    renderAudio();
    return loadAudioSummary();
  }
  function auPost(body, name) {
    var id = cur;
    broadcast('/api/audio', body);
    return api('/api/audio', body).then(function (d) {
      if (id !== cur) return;
      if (name && d && d.supported) rememberPreset(name, d);
      auGot(d);
    }, function (e) { if (id === cur) { toast(e && e.status === 403 ? L.keyChanged : L.unreachable); loadAudioSummary(); } });
  }
  function auQueue(key, val) {
    auQ[key] = val; clearTimeout(auTimer);
    auTimer = setTimeout(function () { var b = auQ; auQ = {}; auTimer = null; auPost(b); }, 150);
  }
  function auSlider(id, icn, tone, label, min, max, step, c1, c2) {
    var card = el('div', 'card slider-card' + (icn ? '' : ' nic'),
      (icn ? '<span class="ic ' + tone + '">' + icon(icn) + '</span>' : '') + '<label class="lbl" for="' + id + '">' + esc(label) + '</label><span class="val" id="' + id + '-v"></span>' +
      '<input id="' + id + '" type="range" min="' + min + '" max="' + max + '" step="' + step + '" style="--c1:' + c1 + ';--c2:' + c2 + '">');
    return card;
  }
  function renderAudio() {
    var box = $('au-body'), ok = auState === 'ok';
    $('au-main').classList.toggle('hidden', !ok || !au.supported);
    if (!ok) {
      auSig = ''; $('au-volbox').innerHTML = '';
      box.innerHTML = '<div class="card muted">' + (auState === 'loading' ? L.checking : L.audioNoText) + '</div>';
      return;
    }
    var eq = au.eq, sig = [lang, au.supported ? 1 : 0, au.volume ? au.volume.max : '-', eq ? eq.bands.length + ':' + eq.min + ':' + eq.max + ':' + eq.presets.join('|') : '-', au.bass ? 1 : 0, au.virt ? 1 : 0, au.loud ? 1 : 0].join(';');
    if (sig !== auSig) { auSig = sig; buildAudio(box); }
    updateAudio();
  }
  function buildAudio(box) {
    var red = '#ff3b3b', amb = '#ffb15c';
    box.innerHTML = ''; $('au-volbox').innerHTML = '';
    if (au.volume) { // media volume: plain Android, independent of the effects
      var vc = auSlider('au-vol', 'audio', 'ic-amber', L.audioVolume, 0, au.volume.max, 1, red, amb);
      $('au-volbox').appendChild(vc);
      vc.querySelector('input').addEventListener('input', function () {
        au.volume.level = +this.value; updateAudio(true); auQueue('volume', +this.value);
      });
    }
    if (!au.supported) { box.appendChild(el('div', 'card muted', esc(L.audioNoText))); return; }
    box.appendChild(el('div', '', '<p class="small muted hidden" id="au-hint">' + L.audioNeedOn + '</p><p class="small muted" style="margin:0">' + L.audioPause + '</p><div class="stack au-ctl" id="au-ctl"></div>'));
    var ctl = $('au-ctl'), eq = au.eq;
    if (eq) {
      ctl.appendChild(el('div', 'small muted', esc(L.audioPresets)));
      var chips = el('div', 'chips'); chips.id = 'au-pre'; chips.setAttribute('role', 'group');
      var flat = el('button', 'chip reset', esc(L.audioReset)); flat.type = 'button'; flat.id = 'au-flat';
      flat.onclick = function () { delete auPre[cur || '']; store('mb_aupre', JSON.stringify(auPre)); auPost({ reset: true }); };
      chips.appendChild(flat);
      eq.presets.forEach(function (name, i) {
        var c = el('button', 'chip', esc(name)); c.type = 'button'; c.setAttribute('data-i', i);
        c.onclick = function () { auPost({ preset: i }, name); };
        chips.appendChild(c);
      });
      ctl.appendChild(chips);
      ctl.appendChild(el('div', 'small muted', esc(L.audioEq)));
      eq.bands.forEach(function (b, i) {
        var card = auSlider('au-b' + i, null, '', fmtHz(b.freq), eq.min, eq.max, 50, red, amb);
        ctl.appendChild(card);
        card.querySelector('input').addEventListener('input', function () {
          var bands = eq.bands.map(function (x, j) { return +$('au-b' + j).value; });
          bands.forEach(function (v, j) { au.eq.bands[j].level = v; });
          updateAudio(true); auQueue('bands', bands);
        });
      });
    }
    [['bass', 'audio', 'ic-red', L.audioBass, 0, 1000, 'strength', true], ['virt', 'spark', 'ic-amber', L.audioVirt, 0, 1000, 'strength', true], ['loud', 'bright', 'ic-cream', L.audioLoud, 0, 1500, 'gain', false]].forEach(function (f) {
      if (!au[f[0]]) return;
      var card = auSlider('au-' + f[0], f[1], f[2], f[3], f[4], f[5], f[0] === 'loud' ? 50 : 10, red, amb);
      ctl.appendChild(card);
      card.querySelector('input').addEventListener('input', function () {
        au[f[0]][f[6]] = +this.value; updateAudio(true); auQueue(f[0], +this.value);
      });
    });
  }
  // Puts the values in the controls; a slider being dragged is left alone
  function updateAudio(local) {
    if (au && au.volume && $('au-vol')) {
      var vr = $('au-vol');
      if (document.activeElement !== vr) vr.value = au.volume.level;
      paintRange(vr); $('au-vol-v').textContent = Math.round(vr.value / Math.max(1, au.volume.max) * 100) + '%';
    }
    if (!$('au-ctl')) { renderAudioRow(); return; }
    var on = !!au.enabled, eq = au.eq;
    $('au-on').checked = on;
    $('au-ctl').classList.toggle('off', !on); $('au-hint').classList.toggle('hidden', on);
    function put(id, v, txt) {
      var r = $(id); if (!r) return;
      r.disabled = !on;
      if (document.activeElement !== r) r.value = v;
      paintRange(r); $(id + '-v').textContent = txt(+r.value);
    }
    if (eq) eq.bands.forEach(function (b, i) { put('au-b' + i, b.level, fmtDb); });
    if (au.bass) put('au-bass', au.bass.strength, function (v) { return Math.round(v / 10) + '%'; });
    if (au.virt) put('au-virt', au.virt.strength, function (v) { return Math.round(v / 10) + '%'; });
    if (au.loud) put('au-loud', au.loud.gain, fmtDb);
    if (eq) {
      var nm = local ? null : auPresetName(), flat = !nm && auFlat();
      Array.prototype.forEach.call($('au-pre').children, function (c) {
        var i = c.getAttribute('data-i');
        c.disabled = !on;
        c.setAttribute('aria-pressed', String(i === null ? flat : eq.presets[+i] === nm));
      });
    }
    renderAudioRow();
  }
  $('au-on').addEventListener('change', function () {
    if (!au) return;
    au.enabled = $('au-on').checked; updateAudio();
    auPost({ enabled: au.enabled });
  });
  $('st-audio').addEventListener('change', function () {
    store('mb_audio', $('st-audio').checked ? '1' : null);
    renderAudioRow(); loadAudioSummary();
  });

  // ---- Texts ----
  function applyTexts() {
    document.documentElement.lang = lang;
    Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (e) { var v = L[e.getAttribute('data-t')]; if (typeof v === 'string') e.textContent = v; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-al]'), function (e) { e.setAttribute('aria-label', L[e.getAttribute('data-al')]); });
    $('sched-on').setAttribute('aria-label', L.schedTitle);
    $('st-audio').setAttribute('aria-label', L.audioSetting); $('au-on').setAttribute('aria-label', L.audioEffects);
    renderDevice(); renderSceneRow(); summary(); renderAudioRow();
    if (view === 'audio') { auSig = ''; renderAudio(); }
    if (view === 'devices') renderDevices();
    if (view === 'scenes') renderScenes();
    if (view === 'settings') renderSettings();
    if (view === 'setup') renderSetup();
    if (scheduleLoaded) { var v = rhythm.getValue(), d = rhythm.days; rhythm.config = config(); setValue(v); rhythm.days = d; }
  }

  // ---- Start ----
  paintIcons();
  applyTexts(); labels();
  ['r-red', 'r-bright', 'r-temp'].forEach(function (id) { paintRange($(id)); });
  rhythm.config = config(); setValue(defaultValue());
  showView(store('mb_welcomed') ? 'home' : 'welcome');
  loadApp(); loadDevices(); refresh(); loadScheduleSummary(); loadAudioSummary();
  setInterval(function () {
    if (document.hidden) return;
    if (!pending) refresh();
    if (view === 'devices') probeAll();
  }, 10000);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { flushSave(); return; }
    // the app restarts its local server when it comes back: give it a moment
    setTimeout(function () {
      loadApp(); refresh(); loadDevices();
      if (view === 'devices') probeAll();
      if (view === 'audio') loadAudio(); else loadAudioSummary();
      if (view === 'schedule' && !saveTimer && !saving && !rhythm.editing) loadScheduleAll(); else loadScheduleSummary();
    }, 600);
  });
})();
</script>
</body>

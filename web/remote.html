<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#102824">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Overlay Dimmer</title>
  <script>
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('dark');
    }
  </script>
  <link rel="stylesheet" href="/remote.css">
</head>
<body class="app-shell">
  <div class="water-ambient" aria-hidden="true"><div class="water-glow"></div></div>

  <main class="max-w-3xl mx-auto px-4 pt-8 pb-40 space-y-4">
    <header class="flex items-center gap-3 mb-2">
      <div class="app-brand-mark">&#9790;</div>
      <div class="flex-1">
        <h1 class="text-2xl">Overlay Dimmer</h1>
        <p class="text-sm" style="color: var(--app-muted)" data-t="subtitle"></p>
      </div>
      <div class="flex gap-1 text-xs" role="group" aria-label="Language">
        <button class="lang sm-chip" data-lang="en" style="min-height:2rem">EN</button>
        <button class="lang sm-chip" data-lang="it" style="min-height:2rem">IT</button>
      </div>
    </header>

    <div id="pair-error" class="hidden card border-red-300 dark:border-red-900/60">
      <p class="font-semibold text-red-600 dark:text-red-400" data-t="pairTitle"></p>
      <p class="text-sm mt-1" style="color: var(--app-muted)" data-t="pairText"></p>
    </div>

    <!-- Live controls -->
    <section class="card space-y-5">
      <div class="flex items-center justify-between">
        <h2 class="font-bold text-lg" data-t="filter"></h2>
        <label class="switch"><input id="on" type="checkbox"><span></span></label>
      </div>
      <div>
        <div class="flex justify-between text-sm mb-1"><span class="text-amber-600 dark:text-amber-400" data-t="red"></span><span id="red-v"></span></div>
        <input id="red" type="range" min="0" max="100" step="5" class="slider-amber w-full">
      </div>
      <div>
        <div class="flex justify-between text-sm mb-1"><span style="color: var(--app-muted)" data-t="bright"></span><span id="bright-v"></span></div>
        <input id="bright" type="range" min="5" max="100" step="5" class="slider-power w-full">
      </div>
      <div>
        <div class="flex justify-between text-sm mb-1"><span style="color: var(--app-muted)" data-t="temp"></span><span id="temp-v"></span></div>
        <input id="temp" type="range" min="1000" max="4000" step="100" class="slider-white w-full">
      </div>
      <div>
        <div class="sm-group-label" data-t="profiles"></div>
        <div id="quick" class="grid grid-cols-3 gap-2"></div>
      </div>
    </section>

    <!-- Schedule: the xaqua-web "slot-machine" timeline -->
    <section class="pt-4">
      <header class="sm-heading">
        <div><h2 data-t="schedTitle"></h2><p data-t="schedSub"></p></div>
        <span class="sm-cycle" data-t="cycle"></span>
      </header>

      <div class="sm-preset-panel card mb-4">
        <div class="flex items-center justify-between mb-3 gap-3">
          <h3 class="font-semibold text-sm" data-t="chooseDay"></h3>
          <label class="inline-flex items-center gap-2 text-sm"><span data-t="schedActive"></span><span class="switch"><input id="sched-on" type="checkbox"><span></span></span></label>
        </div>
        <div id="sm-presets" class="flex flex-wrap gap-2"></div>
      </div>

      <div class="sm-editor">
        <div class="sm-editor-heading">
          <div><h3 data-t="rhythm"></h3><p data-t="rhythmSub"></p></div>
          <span class="sm-now-key" data-t="nowKey"></span>
        </div>
        <div id="sm-spectrum" class="sm-spectrum" aria-hidden="true"></div>
        <div id="sm-reels" class="sm-reels"></div>
        <button id="sm-add" class="btn-secondary w-full mt-3 text-sm" data-t="addSlot"></button>
        <p class="sm-editor-note" data-t="note"></p>
      </div>
    </section>
  </main>

  <div class="sm-apply-bar">
    <div class="sm-apply-inner">
      <div class="sm-apply-feedback" aria-live="polite">
        <span id="sm-dirty" class="text-amber-600 hidden" data-t="dirty"></span>
        <span id="sm-status" style="color: var(--app-muted)"></span>
      </div>
      <button id="sm-apply" class="btn-primary ml-auto" data-t="apply"></button>
    </div>
  </div>

<script>
(function () {
  'use strict';
  var T = {
    en: { subtitle: 'Warm filter and brightness for the TV', pairTitle: 'Not paired', pairText: 'Scan the QR code shown in the Overlay Dimmer app on the TV again.', filter: 'Filter', red: 'Warm filter', bright: 'Brightness', temp: 'Colour (lower = redder)', profiles: 'Profiles', error: 'error',
      schedTitle: 'Your evening of light', schedSub: 'From afternoon to late night, every slot has its own mood.', cycle: '24-hour cycle', chooseDay: 'Choose a day', schedActive: 'Schedule on',
      rhythm: 'The rhythm of the light', rhythmSub: 'Pick a model. Drag the edges to set the times.', nowKey: 'TV time', note: 'Colours are a preview of a grey picture under the filter. The TV switches slot by itself, even with the phone off.',
      dirty: '● changes not applied', apply: 'Apply to TV', sending: 'Sending…', applied: 'Schedule applied', savedOff: 'Schedule off', close: 'Close', startOf: 'Start of', slot: 'Slot',
      fasce: { morning: 'Morning', afternoon: 'Afternoon', evening: 'Evening', film: 'Movie', night: 'Night' },
      models: { off: 'Off', soft: 'Soft', evening: 'Evening', cinema: 'Cinema', night: 'Night', deep: 'Deep night', custom: 'Custom' },
      presets: { movie: 'Movie night', early: 'Early to bed', late: 'Night owl' },
      presetsLabel: 'Presets', myDays: 'My days', saveDay: 'Save as day', dayName: 'Name of this day', daySaved: 'Day saved', deleteDay: 'Delete', addSlot: '+ Add slot', removeSlot: 'Remove slot', done: 'Done', slotName: 'Slot name' },
    it: { subtitle: 'Filtro caldo e luminosità per il TV', pairTitle: 'Non abbinato', pairText: 'Inquadra di nuovo il QR mostrato nell\u2019app Overlay Dimmer sul TV.', filter: 'Filtro', red: 'Filtro caldo', bright: 'Luminosità', temp: 'Colore (più basso = più rosso)', profiles: 'Profili', error: 'errore',
      schedTitle: 'La tua serata di luce', schedSub: 'Dal pomeriggio a notte fonda, ogni fascia ha il suo carattere.', cycle: 'Ciclo di 24 ore', chooseDay: 'Scegli una giornata', schedActive: 'Programmazione attiva',
      rhythm: 'Il ritmo della luce', rhythmSub: 'Seleziona un modello. Trascina i bordi per regolare gli orari.', nowKey: 'Ora TV', note: 'I colori sono un\u2019anteprima di un\u2019immagine grigia sotto il filtro. Il TV cambia fascia da solo, anche col telefono spento.',
      dirty: '● modifiche non applicate', apply: 'Applica al TV', sending: 'Invio…', applied: 'Programmazione applicata', savedOff: 'Programmazione spenta', close: 'Chiudi', startOf: 'Inizio', slot: 'Fascia',
      fasce: { morning: 'Mattina', afternoon: 'Pomeriggio', evening: 'Sera', film: 'Film', night: 'Notte' },
      models: { off: 'Spento', soft: 'Tenue', evening: 'Sera', cinema: 'Cinema', night: 'Notte', deep: 'Notte fonda', custom: 'Personalizzato' },
      presets: { movie: 'Serata film', early: 'A letto presto', late: 'Nottambulo' },
      presetsLabel: 'Preset', myDays: 'Le mie giornate', saveDay: 'Salva come giornata', dayName: 'Nome di questa giornata', daySaved: 'Giornata salvata', deleteDay: 'Elimina', addSlot: '+ Aggiungi fascia', removeSlot: 'Rimuovi fascia', done: 'Fatto', slotName: 'Nome della fascia' }
  };
  // Language: the one chosen on this phone, else the phone language, else English.
  var saved = null; try { saved = localStorage.getItem('od_lang'); } catch (e) {}
  var lang = T[saved] ? saved : (T[(navigator.language || 'en').slice(0, 2)] ? (navigator.language || 'en').slice(0, 2) : 'en');
  var L = T[lang];
  function applyTexts() {
    document.documentElement.lang = lang;
    Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (el) { el.textContent = L[el.getAttribute('data-t')]; });
    Array.prototype.forEach.call(document.querySelectorAll('.lang'), function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang));
      b.style.background = b.getAttribute('data-lang') === lang ? 'var(--app-surface-soft)' : '';
      b.style.borderColor = b.getAttribute('data-lang') === lang ? 'var(--app-accent)' : '';
    });
  }
  applyTexts();
  Array.prototype.forEach.call(document.querySelectorAll('.lang'), function (b) {
    b.addEventListener('click', function () {
      lang = b.getAttribute('data-lang'); L = T[lang];
      try { localStorage.setItem('od_lang', lang); } catch (e) {}
      applyTexts(); renderQuick(); renderPresets(); renderReels();
    });
  });

  function $(id) { return document.getElementById(id); }

  // Pairing key: arrives in the URL fragment from the QR code, then kept on the phone.
  var m = location.hash.match(/k=([0-9a-f]+)/);
  if (m) { try { localStorage.setItem('od_key', m[1]); } catch (e) {} history.replaceState(null, '', location.pathname); }
  var key = m ? m[1] : (function () { try { return localStorage.getItem('od_key'); } catch (e) { return null; } })();

  function api(path, body) {
    return fetch(path, {
      method: body ? 'POST' : 'GET',
      headers: body ? { 'X-Key': key || '', 'Content-Type': 'application/json' } : { 'X-Key': key || '' },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      $('pair-error').classList.toggle('hidden', r.status !== 403);
      if (!r.ok) throw new Error(r.status);
      return r.json();
    });
  }
  function toast(msg, kind) {
    var t = document.createElement('div');
    t.className = 'toast ' + (kind === 'error' ? 'bg-red-600' : 'bg-emerald-700');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2200);
  }

  // ---- Live controls ----
  function labels() {
    $('red-v').textContent = $('red').value + '%';
    $('bright-v').textContent = $('bright').value + '%';
    $('temp-v').textContent = $('temp').value + ' K';
  }
  function show(s) {
    if (typeof s.minute === 'number') {
      var n = new Date(); deviceOffset = s.minute - (n.getHours() * 60 + n.getMinutes() + n.getSeconds() / 60);
      if (deviceOffset > 720) deviceOffset -= 1440; if (deviceOffset < -720) deviceOffset += 1440;
    }
    $('on').checked = s.on;
    $('red').value = s.red; $('bright').value = s.bright; $('temp').value = s.temp;
    labels();
    current = s; renderQuick();
  }
  var pending = null;
  function sendLive() {
    clearTimeout(pending);
    pending = setTimeout(function () {
      api('/api/set', { on: true, red: +$('red').value, bright: +$('bright').value, temp: +$('temp').value })
        .then(show).catch(function () {});
    }, 120);
  }
  ['red', 'bright', 'temp'].forEach(function (id) {
    $(id).addEventListener('input', function () { labels(); $('on').checked = true; sendLive(); });
  });
  $('on').addEventListener('change', function () { api('/api/set', { on: $('on').checked }).then(show).catch(function () {}); });
  // Quick profiles: the same models used by the schedule, so a profile means the same thing everywhere.
  var current = null;
  function renderQuick() {
    var box = $('quick'); box.innerHTML = '';
    MODELS.forEach(function (m) {
      if (m.id === 'off' || m.id === 'custom') return;
      var b = document.createElement('button');
      b.className = 'sm-model-option';
      var active = current && current.on && current.red === m.red && current.bright === m.bright && current.temp === m.temp;
      b.setAttribute('aria-pressed', String(!!active));
      b.innerHTML = '<div>' + screenIcon(m) + '</div><div>' + L.models[m.id] + '</div>';
      b.onclick = function () {
        api('/api/set', { on: true, red: m.red, bright: m.bright, temp: m.temp }).then(show).catch(function () {});
      };
      box.appendChild(b);
    });
  }
  function refresh() { api('/api/state').then(show).catch(function () {}); }

  // ---- Schedule: timeline of time slots, ported from the xaqua-web "slot-machine" schedule ----
  // Slots are cards sized by their duration; drag a card edge (or use the arrow keys on it) to move its start
  // time. Tap a slot's icon to choose its setting (or a custom one), rename or remove it. Slots can be added,
  // and a day can be saved with a name on the TV. Apply sends the day to the TV, which switches slot by itself.
  var DAY_MIN = 1440, MIN_GAP = 30, SNAP = 5, MAX_SLOTS = 12;
  var MODELS = [
    { id: 'off',     on: false, red: 0,  bright: 100, temp: 1100 },
    { id: 'soft',    on: true,  red: 10, bright: 70,  temp: 1800 },
    { id: 'evening', on: true,  red: 20, bright: 40,  temp: 1100 },
    { id: 'cinema',  on: true,  red: 15, bright: 55,  temp: 1500 },
    { id: 'night',   on: true,  red: 20, bright: 10,  temp: 1100 },
    { id: 'deep',    on: true,  red: 40, bright: 5,   temp: 1000 },
    { id: 'custom',  on: true,  red: 20, bright: 40,  temp: 1100 }
  ];
  var FASCE = [
    { key: 'morning',   time: '07:00', model: 'off' },
    { key: 'afternoon', time: '14:00', model: 'off' },
    { key: 'evening',   time: '19:30', model: 'evening' },
    { key: 'film',      time: '21:00', model: 'cinema' },
    { key: 'night',     time: '23:00', model: 'night' }
  ];
  var PRESETS = [
    { id: 'movie', icon: '🎬', sel: { morning: 'off', afternoon: 'off', evening: 'evening', film: 'cinema', night: 'night' },
      times: { morning: '07:00', afternoon: '14:00', evening: '19:30', film: '21:00', night: '23:30' } },
    { id: 'early', icon: '😴', sel: { morning: 'off', afternoon: 'soft', evening: 'evening', film: 'night', night: 'deep' },
      times: { morning: '07:00', afternoon: '16:00', evening: '19:00', film: '21:00', night: '22:30' } },
    { id: 'late', icon: '🦉', sel: { morning: 'off', afternoon: 'off', evening: 'soft', film: 'cinema', night: 'night' },
      times: { morning: '08:30', afternoon: '15:00', evening: '20:30', film: '22:00', night: '01:00' } }
  ];
  var st = { fasce: [], enabled: false, dirty: false };
  var days = [];
  var cardEls = {}, nowLine = null, deviceOffset = 0, uid = 0;

  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function t2m(hhmm) { var p = String(hhmm).split(':'); return (+p[0]) * 60 + (+p[1]); }
  function m2t(min) { min = ((Math.round(min) % DAY_MIN) + DAY_MIN) % DAY_MIN; var h = Math.floor(min / 60), m = min % 60; return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m; }
  function isWide() { return window.matchMedia('(min-width: 768px)').matches; }
  function modelById(id) { for (var i = 0; i < MODELS.length; i++) if (MODELS[i].id === id) return MODELS[i]; return MODELS[0]; }
  function faById(id) { for (var i = 0; i < st.fasce.length; i++) if (st.fasce[i].id === id) return st.fasce[i]; return null; }
  function ordered() {
    var arr = st.fasce.slice().sort(function (a, b) { return t2m(a.time) - t2m(b.time); });
    for (var i = 0; i < arr.length; i++) { var nx = arr[(i + 1) % arr.length]; var d = t2m(nx.time) - t2m(arr[i].time); if (d <= 0) d += DAY_MIN; arr[i]._dur = d; }
    return arr;
  }
  function nowMinutes() { var n = new Date(); var m = n.getHours() * 60 + n.getMinutes() + n.getSeconds() / 60 + deviceOffset; return ((m % DAY_MIN) + DAY_MIN) % DAY_MIN; }
  // Values of a slot: its model, or its own values for a custom slot.
  function valuesOf(fa) { var m = modelById(fa.modelId); return m.id === 'custom' && fa.custom ? { on: true, red: fa.custom.red, bright: fa.custom.bright, temp: fa.custom.temp } : m; }
  function labelOf(fa) { return fa.key ? L.fasce[fa.key] : fa.label; }

  // Preview of a mid-grey picture under the filter, with the same formula the app uses (DimService.java).
  function kelvinRgb(k) {
    var t = k / 100, r, g, b;
    r = t <= 66 ? 255 : 329.698727446 * Math.pow(t - 60, -0.1332047592);
    g = t <= 66 ? 99.4708025861 * Math.log(t) - 161.1195681661 : 288.1221695283 * Math.pow(t - 60, -0.0755148492);
    b = t >= 66 ? 255 : t <= 19 ? 0 : 138.5177312231 * Math.log(t - 10) - 305.0447927307;
    return [r, g, b].map(function (v) { return clamp(Math.round(v), 0, 255); });
  }
  function previewCss(v) {
    if (!v.on) return 'rgb(205,205,205)';
    var tint = kelvinRgb(v.temp), tintA = v.red / 100 * 0.65, dimA = (100 - v.bright) / 100, base = 205;
    var c = tint.map(function (x) { return ((base * (1 - tintA) + x * tintA) * (1 - dimA)) | 0; });
    return 'rgb(' + c.join(',') + ')';
  }
  // Icon: a tiny screen showing the effect (striped when off, a gradient for "custom").
  function screenIcon(model, values) {
    if (model.id === 'off') return '<span class="od-screen off"></span>';
    if (model.id === 'custom' && !values) return '<span class="od-screen custom"></span>';
    return '<span class="od-screen" style="background:' + previewCss(values || model) + '"></span>';
  }

  function markDirty() { st.dirty = true; $('sm-dirty').classList.remove('hidden'); $('sm-status').textContent = ''; }

  function chip(html, onclick) { var b = el('button', 'sm-chip', html); b.onclick = onclick; return b; }
  function renderPresets() {
    var box = $('sm-presets'); box.innerHTML = '';
    var sec = el('div', ''); sec.appendChild(el('div', 'sm-group-label', esc(L.presetsLabel)));
    var chips = el('div', 'flex flex-wrap gap-2 mb-4');
    PRESETS.forEach(function (p) {
      chips.appendChild(chip('<span class="text-base">' + p.icon + '</span>' + esc(L.presets[p.id]), function () {
        st.fasce = FASCE.map(function (f) { return { id: 'f' + (uid++), key: f.key, label: L.fasce[f.key], modelId: p.sel[f.key], time: p.times[f.key] }; });
        renderReels(); markDirty();
      }));
    });
    sec.appendChild(chips); box.appendChild(sec);
    var mine = el('div', 'border-t pt-4'); mine.style.borderColor = 'var(--app-border)';
    mine.appendChild(el('div', 'sm-group-label', esc(L.myDays)));
    var mineChips = el('div', 'flex flex-wrap gap-2');
    days.forEach(function (d) {
      var wrap = el('span', 'sm-chip'); wrap.style.padding = '0'; wrap.style.overflow = 'hidden';
      var b = el('button', 'px-3 py-2', '🗓️ ' + esc(d.name));
      b.onclick = function () { st.fasce = slotsToFasce(d.slots); renderReels(); markDirty(); };
      var del = el('button', 'px-3 py-2 sm-danger', '✕');
      del.setAttribute('aria-label', L.deleteDay + ' ' + d.name);
      del.onclick = function () {
        if (!confirm(L.deleteDay + ' “' + d.name + '”?')) return;
        api('/api/days', { name: d.name, delete: true }).then(loadDays).catch(function () {});
      };
      wrap.appendChild(b); wrap.appendChild(del); mineChips.appendChild(wrap);
    });
    mineChips.appendChild(chip('💾 ' + esc(L.saveDay), saveDay));
    mine.appendChild(mineChips); box.appendChild(mine);
  }
  function saveDay() {
    var name = prompt(L.dayName, '');
    if (!name || !name.trim()) return;
    api('/api/days', { name: name.trim(), slots: slotsFromState() }).then(function () { toast(L.daySaved); loadDays(); })
      .catch(function () { toast(L.error, 'error'); });
  }
  function loadDays() {
    return api('/api/days').then(function (d) { days = Array.isArray(d) ? d : []; renderPresets(); }).catch(function () {});
  }

  function renderReels() {
    var box = $('sm-reels'); box.innerHTML = ''; cardEls = {};
    ordered().forEach(function (fa, idx) {
      var m = modelById(fa.modelId), v = valuesOf(fa);
      var card = el('div', 'sm-slot');
      card.style.flexGrow = fa._dur;
      var tint = el('div', 'sm-slot-tint');
      tint.style.background = v.on ? previewCss(v) : 'transparent';
      card.appendChild(tint);
      if (idx > 0) {
        var handle = el('div', 'sm-boundary');
        handle.tabIndex = 0;
        handle.setAttribute('role', 'slider');
        handle.setAttribute('aria-label', L.startOf + ' ' + labelOf(fa));
        handle.addEventListener('keydown', function (e) {
          if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].indexOf(e.key) < 0) return;
          e.preventDefault();
          setTime(fa.id, t2m(fa.time) + ((e.key === 'ArrowRight' || e.key === 'ArrowDown') ? SNAP : -SNAP));
          layout(); markDirty();
        });
        handle.appendChild(el('div', ''));
        attachEdge(handle, fa.id);
        card.appendChild(handle);
      }
      var content = el('div', 'sm-slot-content');
      var badge = el('div', 'sm-slot-time');
      content.appendChild(badge);
      content.appendChild(el('div', 'sm-slot-label', esc(labelOf(fa))));
      var pick = el('button', 'sm-model-trigger');
      pick.setAttribute('aria-label', labelOf(fa) + ': ' + L.models[m.id]);
      pick.setAttribute('aria-haspopup', 'dialog');
      pick.appendChild(el('div', '', screenIcon(m, v)));
      pick.appendChild(el('div', '', esc(L.models[m.id]) + ' <span style="color: var(--app-muted)">▾</span>'));
      pick.onclick = function (e) { e.stopPropagation(); openSlot(fa.id); };
      content.appendChild(pick);
      card.appendChild(content);
      box.appendChild(card); cardEls[fa.id] = { card: card, badge: badge };
    });
    nowLine = el('div', 'sm-now-line');
    box.appendChild(nowLine);
    $('sm-add').disabled = st.fasce.length >= MAX_SLOTS;
    layout();
  }

  function layout() {
    var arr = ordered(); var first = arr.length ? t2m(arr[0].time) : 0;
    var spectrum = $('sm-spectrum'); spectrum.innerHTML = '';
    arr.forEach(function (fa) {
      var refs = cardEls[fa.id]; if (!refs) return;
      refs.card.style.flexGrow = fa._dur;
      refs.badge.textContent = fa.time + '–' + m2t((t2m(fa.time) + fa._dur) % DAY_MIN);
      var seg = el('span', 'sm-spectrum-segment');
      seg.style.flexGrow = fa._dur;
      seg.style.background = previewCss(valuesOf(fa));
      spectrum.appendChild(seg);
    });
    if (nowLine) {
      var frac = ((((nowMinutes() - first) % DAY_MIN) + DAY_MIN) % DAY_MIN) / DAY_MIN;
      if (isWide()) { nowLine.style.left = (frac * 100) + '%'; nowLine.style.top = '0'; }
      else { nowLine.style.top = (frac * 100) + '%'; nowLine.style.left = '0'; }
    }
  }

  // Slot popup: name, setting (model grid or custom sliders, like the xaqua-web WLED editor), remove.
  function openSlot(id) {
    var fa = faById(id); if (!fa) return;
    var ov = el('div', 'sm-modal-overlay');
    var panel = el('div', 'sm-model-panel');
    panel.style.transform = 'scale(.82)'; panel.style.opacity = '0';
    panel.setAttribute('role', 'dialog'); panel.setAttribute('aria-modal', 'true');
    panel.appendChild(el('div', '', fa.time));
    var name = el('input', 'input mb-3'); name.value = labelOf(fa); name.maxLength = 24;
    name.setAttribute('aria-label', L.slotName);
    name.oninput = function () { fa.key = null; fa.label = name.value; markDirty(); };
    panel.appendChild(name);
    var grid = el('div', 'grid grid-cols-3 gap-2');
    var custom = el('div', 'od-custom space-y-3');
    function sliders() {
      var c = fa.custom || (fa.custom = { red: valuesOf(fa).red, bright: valuesOf(fa).bright, temp: valuesOf(fa).temp });
      custom.innerHTML = '';
      [['red', L.red, 0, 100, 5, '%', 'slider-amber'], ['bright', L.bright, 5, 100, 5, '%', 'slider-power'], ['temp', L.temp, 1000, 4000, 100, ' K', 'slider-white']].forEach(function (d) {
        var row = el('div', '');
        var head = el('div', 'flex justify-between text-sm mb-1', '<span>' + esc(d[1]) + '</span><span>' + c[d[0]] + d[5] + '</span>');
        var r = el('input', d[6] + ' w-full'); r.type = 'range'; r.min = d[2]; r.max = d[3]; r.step = d[4]; r.value = c[d[0]];
        r.oninput = function () { c[d[0]] = +r.value; head.lastChild.textContent = r.value + d[5]; markDirty(); renderReels(); };
        row.appendChild(head); row.appendChild(r); custom.appendChild(row);
      });
    }
    function tiles() {
      grid.innerHTML = '';
      MODELS.forEach(function (m) {
        var tile = el('button', 'sm-model-option');
        tile.setAttribute('aria-pressed', String(m.id === fa.modelId));
        tile.appendChild(el('div', '', screenIcon(m, m.id === 'custom' && fa.modelId === 'custom' ? valuesOf(fa) : null)));
        tile.appendChild(el('div', '', esc(L.models[m.id])));
        tile.onclick = function () {
          fa.modelId = m.id; markDirty(); renderReels(); tiles();
          if (m.id === 'custom') { custom.classList.remove('hidden'); sliders(); } else custom.classList.add('hidden');
        };
        grid.appendChild(tile);
      });
    }
    tiles();
    panel.appendChild(grid);
    if (fa.modelId === 'custom') sliders(); else custom.classList.add('hidden');
    panel.appendChild(custom);
    var actions = el('div', 'flex gap-2 mt-3');
    var remove = el('button', 'btn-secondary sm-danger flex-1', esc(L.removeSlot));
    remove.disabled = st.fasce.length <= 1;
    remove.onclick = function () {
      st.fasce = st.fasce.filter(function (x) { return x.id !== id; });
      markDirty(); close(); renderReels();
    };
    var done = el('button', 'btn-primary flex-1', esc(L.done));
    done.onclick = close;
    actions.appendChild(remove); actions.appendChild(done);
    panel.appendChild(actions);
    ov.appendChild(panel); document.body.appendChild(ov);
    requestAnimationFrame(function () { panel.style.transform = 'scale(1)'; panel.style.opacity = '1'; });
    function onKey(e) { if (e.key === 'Escape') close(); }
    document.addEventListener('keydown', onKey);
    function close() {
      document.removeEventListener('keydown', onKey);
      if (ov.isConnected) document.body.removeChild(ov);
      renderReels();
      var trigger = cardEls[id] && cardEls[id].card.querySelector('.sm-model-trigger');
      if (trigger) trigger.focus();
    }
    ov.onclick = function (e) { if (e.target === ov) close(); };
  }

  // New slot in the middle of the longest one, with the same setting.
  function addSlot() {
    if (st.fasce.length >= MAX_SLOTS) return;
    var arr = ordered(), longest = arr[0];
    arr.forEach(function (fa) { if (fa._dur > longest._dur) longest = fa; });
    if (!longest || longest._dur < MIN_GAP * 2) return;
    var n = { id: 'f' + (uid++), key: null, label: L.slot + ' ' + (st.fasce.length + 1), modelId: longest.modelId,
      time: m2t(Math.round((t2m(longest.time) + longest._dur / 2) / SNAP) * SNAP),
      custom: longest.custom ? { red: longest.custom.red, bright: longest.custom.bright, temp: longest.custom.temp } : null };
    st.fasce.push(n); renderReels(); markDirty(); openSlot(n.id);
  }

  function setTime(id, minutes) {
    var arr = ordered(), idx = -1; for (var i = 0; i < arr.length; i++) if (arr[i].id === id) idx = i;
    var prev = idx > 0 ? t2m(arr[idx - 1].time) + MIN_GAP : 0;
    var next = idx < arr.length - 1 ? t2m(arr[idx + 1].time) - MIN_GAP : DAY_MIN - 1;
    var fa = faById(id); if (fa) fa.time = m2t(clamp(Math.round(minutes / SNAP) * SNAP, prev, next));
  }
  function attachEdge(handle, id) {
    handle.addEventListener('pointerdown', function (ev) {
      ev.preventDefault(); ev.stopPropagation();
      var box = $('sm-reels'), rect = box.getBoundingClientRect(), wide = isWide();
      var size = wide ? rect.width : rect.height, startCoord = wide ? ev.clientX : ev.clientY, startMin = t2m(faById(id).time);
      handle.setPointerCapture(ev.pointerId);
      function move(e) { var cur = wide ? e.clientX : e.clientY; setTime(id, startMin + (cur - startCoord) / size * DAY_MIN); layout(); }
      function up() { try { handle.releasePointerCapture(ev.pointerId); } catch (x) {} handle.removeEventListener('pointermove', move); handle.removeEventListener('pointerup', up); markDirty(); }
      handle.addEventListener('pointermove', move); handle.addEventListener('pointerup', up);
    });
  }

  function slotsFromState() {
    return ordered().map(function (fa) {
      var v = valuesOf(fa);
      return { time: fa.time, on: v.on, red: v.red, bright: v.bright, temp: v.temp, model: fa.modelId, label: labelOf(fa) };
    });
  }
  function slotsToFasce(slots) {
    return slots.map(function (s) {
      var key = null; for (var k in T.en.fasce) if (T.en.fasce[k] === s.label || T.it.fasce[k] === s.label) key = k;
      var known = null; for (var i = 0; i < MODELS.length; i++) if (MODELS[i].id === s.model) known = MODELS[i];
      var modelId = known ? known.id : (s.on ? 'custom' : 'off');
      return { id: 'f' + (uid++), key: key, label: s.label || L.slot, modelId: modelId, time: s.time,
        custom: modelId === 'custom' ? { red: s.red, bright: s.bright, temp: s.temp } : null };
    });
  }
  function sendSchedule(enabled) {
    var btn = $('sm-apply'); btn.disabled = true; $('sm-status').textContent = L.sending;
    return api('/api/schedule', { enabled: enabled, slots: slotsFromState() }).then(function () {
      btn.disabled = false; st.enabled = enabled; $('sched-on').checked = enabled;
      st.dirty = false; $('sm-dirty').classList.add('hidden');
      $('sm-status').textContent = '✓ ' + (enabled ? L.applied : L.savedOff);
      setTimeout(refresh, 400);
    }).catch(function () { btn.disabled = false; $('sm-status').textContent = '✕ ' + L.error; });
  }
  function defaultState() {
    st.fasce = FASCE.map(function (f) { return { id: 'f' + (uid++), key: f.key, label: L.fasce[f.key], modelId: f.model, time: f.time }; });
  }
  function loadSchedule() {
    return api('/api/schedule').then(function (d) {
      if (d.slots && d.slots.length && !st.dirty) st.fasce = slotsToFasce(d.slots);
      st.enabled = !!d.enabled; $('sched-on').checked = st.enabled;
      renderReels();
    }).catch(function () {});
  }
  function bootSchedule() {
    defaultState(); renderPresets(); renderReels();
    $('sm-apply').onclick = function () { sendSchedule(true); };
    $('sm-add').onclick = addSlot;
    $('sched-on').addEventListener('change', function () { sendSchedule($('sched-on').checked); });
    loadSchedule(); loadDays();
  }

  labels();
  renderQuick();
  refresh();
  bootSchedule();
  window.addEventListener('resize', layout);
  setInterval(function () { if (!document.hidden) { refresh(); layout(); } }, 15000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { refresh(); loadSchedule(); } });
})();
</script>
</body>
